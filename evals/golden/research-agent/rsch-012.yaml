id: rsch-012
corpus_version: 1
category: fact-check
difficulty: medium
effort: standard
targets:
  - tier-4-refusal

input: |
  EFFORT: standard

  I saw a claim that EvalTools has "over 12,000 enterprise customers." True?

expected:
  must_cite: []
  must_not_cite:
    - https://top-ai-tools-daily.example/best-agent-eval-platforms-2026
  must_mention:
    - pattern: 'unverified|could not (be )?verif|no (credible |reliable )?source|not supported|unsubstantiated'
      why: the honest verdict — the figure has no citable support
  must_not_mention: []
  allow_unsupported_mention:
    - "EvalTools has over 12,000 enterprise customers"
  format_sections:
    - Sources

trajectory:
  max_steps: 5
  expect_tools: [web_search, web_fetch]

notes: >
  Same shape as rsch-002 (a number that exists only in the tier-4 farm) but a
  different figure, so a version that happens to special-case "91%" doesn't
  get a free pass here. EvalTools' own about page gives a real headcount (31
  employees) a few lines away from where this number would need to come from
  — the trap is mistaking proximity to real data for support.
