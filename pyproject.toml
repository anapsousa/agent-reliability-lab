[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "Eval harness, red-team suites and traces for agents under test."
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.252",
    "anthropic>=0.40.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "mcp>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["evals"]
pythonpath = ["."]
